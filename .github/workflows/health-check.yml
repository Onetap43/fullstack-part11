name: Periodic health check

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application health
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://fullstack-part11-12gb.onrender.com/this-route-does-not-exist
          max-attempts: 3
          retry-delay: 5s